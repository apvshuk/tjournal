{% load static %}
{% load i18n %}

<link rel="stylesheet" href="{% static 'allauth/css/login.css' %}">
<script defer src="{% static 'allauth/js/login.js' %}"></script>

<div class="d-flex mx-auto {% if border != 'hide' %}border border-1 login{% endif %}" id="login_box">
    {% if img != 'hide' %}
        <div class="login__left">
            <img src="{% static 'images/authenticate_left_img.png' %}" alt=" ">
        </div>
    {% endif %}
    <div class="login__right login__options px-4 bg-white">
        <h6 class="back_to_login_options via_mail_signin_btn show_login_options link-blue mt-3 my-auto d-none"><i class="fas fa-chevron-left"></i><span class="px-3">Back to authorization</span></h6>
        <div class="login__right__options">
            {% if hide != true %}
            {% include 'components/login/login_options.component.html' with mail=mail process=process %}
            {% endif %}
        </div>
    </div>
</div>
