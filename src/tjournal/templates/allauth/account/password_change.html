{% extends "account/base.html" %}

{% load i18n %}

{% block head_title %}{% trans "Change Password" %}{% endblock %}

{% block content %}
<div class="container-box">
    <div class="box-fluid">
        <h1>{% trans "Change Password" %}</h1>

        <form method="POST" action="{% url 'account_change_password' %}" id="password_change">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="submit_password_change transp-btn btn-bx-s w-100" name="action">{% trans "Change Password" %}</button>
            <div class="mt-3">
                <a class="link-underline-dotted anchor-reload" href="{% url 'account_reset_password' %}">{% trans "Forgot Password?" %}</a>
            </div>
        </form>
    </div>
</div>

<script defer>
    $(document).on('submit', '#password_change', (e) => {
        e.preventDefault();
        let formData = new FormData();
        formData.append('oldpassword', document.getElementsByName('oldpassword')[0].value);
        formData.append('password1', document.getElementsByName('password1')[0].value);
        formData.append('password2', document.getElementsByName('password2')[0].value);
        formData.append('csrfmiddlewaretoken', document.getElementsByName('csrfmiddlewaretoken')[0].value);
        $.ajax({
            method: 'POST',
            url: $('#password_change').attr('action'),
            data: formData,
            enctype: 'multipart/form-data',
            success: (data) => {
                let next_ = new URL(window.location).searchParams.get('next');
                if (next_ != undefined) {
                    window.location = next_;
                } else {
                    window.location = '/';
                }
            },
            error: (error) => {
                for (let i in error.responseJSON.form.fields) {
                    for (let j of error.responseJSON.form.fields[i].errors) {
                        $(`input[name=${i}]`).parent().append(`
                            <span class="alerts_password_change text-danger d-block mb-1 fw-bold">${j}</span>
                        `);
                    }
                }
                $('.submit_password_change').attr('disabled', false);
            },
            beforeSend: () => {
                $('.submit_password_change').attr('disabled', true);
                $('.alerts_password_change').remove();
            },
            cache: false,
            contentType: false,
            processData: false,
        });
    });
</script>
{% endblock %}
