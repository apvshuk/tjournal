{% extends "account/base.html" %}

{% load i18n %}

{% block head_title %}{% trans "Set Password" %}{% endblock %}

{% block content %}
<div class="container-box">
    <div class="box-fluid">
        <h1>{% trans "Set Password" %}</h1>

        <form method="POST" action="{% url 'account_set_password' %}" id="password_set">
            {% csrf_token %}
            {{ form.as_p }}
            <input type="submit" name="action" value="{% trans 'Set Password' %}" id="submit_password_set"/>
        </form>
    </div>
</div>

<script defer>
    $(document).on('submit', '#password_set', (e) => {
        e.preventDefault();
        let formData = new FormData();
        formData.append('password1', document.getElementsByName('password1')[0].value);
        formData.append('password2', document.getElementsByName('password2')[0].value);
        formData.append('csrfmiddlewaretoken', document.getElementsByName('csrfmiddlewaretoken')[0].value);
        $.ajax({
            method: 'POST',
            url: $('#password_set').attr('action'),
            data: formData,
            enctype: 'multipart/form-data',
            success: (data) => {
                let next_ = new URL(window.location).searchParams.get('next');
                if (next_ != undefined) {
                    window.location = next_;
                } else {
                    window.location = '/';
                }
            },
            error: (error) => {
                for (let i in error.responseJSON.form.fields) {
                    for (let j of error.responseJSON.form.fields[i].errors) {
                        $(`input[name=${i}]`).parent().append(`
                            <span class="alerts_password_set text-danger d-block mb-1 fw-bold">${j}</span>
                        `);
                    }
                }
                $('#submit_password_set').attr('disabled', false);
            },
            beforeSend: () => {
                $('#submit_password_set').attr('disabled', true);
                $('.alerts_password_set').remove();
            },
            cache: false,
            contentType: false,
            processData: false,
        });
    });
</script>
{% endblock %}
